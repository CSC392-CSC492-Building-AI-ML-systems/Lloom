# Runs on every PR to main. Two jobs, each shows up as its own check.
# To add a new check later, add a step to the matching job (or a new job).
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels the previous run for that PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Builds the Svelte widgets. The Python package can't be imported without this output.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: static
          path: text_lloom/src/text_lloom/static

  # Installs the package and runs the tests in text_lloom/tests (no API key needed).
  python:
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: static
          path: text_lloom/src/text_lloom/static
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: text_lloom/pyproject.toml
      - run: pip install -e text_lloom pytest
      - run: pytest text_lloom/tests
