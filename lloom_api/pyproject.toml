[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lloom_api"
version = "0.1.0"
description = "FastAPI backend for the LLooM web app"
requires-python = ">=3.10"

# text_lloom isn't listed (pip can't use relative paths); install it with pip install -e ./text_lloom
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*"]
